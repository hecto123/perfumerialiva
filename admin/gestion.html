<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Admin | Perfumería LIVA</title>
	<link rel="stylesheet" href="../css/styles.css">
	<style>
		main{padding:20px;max-width:1000px;margin:0 auto}
		.card{background:#111;padding:18px;border-radius:12px;margin-bottom:16px}
		label{display:block;margin:8px 0}
		input[type=text], input[type=number], textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #333;background:#0e0e0e;color:#fff}
		.row{display:flex;gap:12px}
		.row .col{flex:1}
		.product-list{margin-top:12px}
		.product-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #222}
		.btn{background:#d4af37;color:#111;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
	</style>
</head>
<body>
	<main>
		<h1>Panel Admin — Perfumería LIVA</h1>

		<section class="card">
			<h2>Agregar / Editar producto</h2>
			<form id="adminForm">
				<label>Nombre <input id="productName" type="text" placeholder="Nombre"></label>
				<div class="row">
					<div class="col"><label>Precio <input id="productPrice" type="number" placeholder="Precio"></label></div>
					<div class="col"><label>Tamaño <input id="productSize" type="text" placeholder="100ml"></label></div>
				</div>
				<label>Categoría <select id="productCategory">
					<option value="Hombre">Hombre</option>
					<option value="Dama">Dama</option>
					<option value="Inspiraciones">Inspiraciones</option>
				</select></label>
				<label>Ingredientes <input id="productIngredients" type="text" placeholder="nota1, nota2"></label>
				<label>Imagen <input id="productImage" type="file" accept="image/*"></label>
				<div id="imagePreview" style="margin:8px 0;min-height:80px"></div>
				<div style="margin-top:8px">
					<button class="btn" id="addProductButton" type="submit">Agregar producto</button>
					<button class="btn" id="cancelEditButton" type="button" style="display:none;margin-left:8px">Cancelar</button>
				</div>
			</form>
		</section>

		<section class="card">
			<h2>Productos</h2>
			<label>Filtrar por categoría: 
				<select id="categoryFilterSelect" style="margin-left:8px;padding:6px;border-radius:6px;background:#0e0e0e;color:#fff">
					<option value="Todos">Todos</option>
				</select>
			</label>
			<div id="productList" class="product-list"></div>
		</section>
	</main>

	<script>
		const STORAGE_KEY='perfumerialiva_products';
		let products = [];
		let editIndex = null;

		const productList = document.getElementById('productList');
		const productName = document.getElementById('productName');
		const productPrice = document.getElementById('productPrice');
		const productSize = document.getElementById('productSize');
		const productCategory = document.getElementById('productCategory');
		const productIngredients = document.getElementById('productIngredients');
		const productImage = document.getElementById('productImage');
		const imagePreview = document.getElementById('imagePreview');
		const adminForm = document.getElementById('adminForm');
		const addProductButton = document.getElementById('addProductButton');
		const cancelEditButton = document.getElementById('cancelEditButton');

		function load(){
			const stored = localStorage.getItem(STORAGE_KEY);
			products = stored? JSON.parse(stored) : [];
			renderCategoryOptions();
			renderList();
		}

		function save(){
			localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
		}

		function renderList(){
			productList.innerHTML = '';
			if(products.length===0){ productList.innerHTML = '<p>No hay productos.</p>'; return; }
			const filterSelect = document.getElementById('categoryFilterSelect');
			const selected = filterSelect ? filterSelect.value : 'Todos';
			const filtered = products
				.map((p,index)=>({product:p,index}))
				.filter(item => selected==='Todos' || (item.product.categoria || '') === selected);
			if(filtered.length===0){ productList.innerHTML = '<p>No hay productos para esa categoría.</p>'; return; }
			filtered.forEach(item=>{
				const p = item.product;
				const originalIndex = item.index;
				const div = document.createElement('div');
				div.className='product-item';
				div.innerHTML = `<div><strong>${p.nombre}</strong><div style="font-size:12px;color:#aaa">${p.categoria||''} • $${p.precio}</div></div>
					<div>
						<button class="btn" onclick="startEdit(${originalIndex})">Editar</button>
						<button class="btn" onclick="deleteProduct(${originalIndex})">Eliminar</button>
					</div>`;
				productList.appendChild(div);
			});
		}

		function renderCategoryOptions(){
			const select = document.getElementById('categoryFilterSelect');
			if(!select) return;
			const cats = ['Hombre','Mujer'];
			const prev = select.value || 'Todos';
			select.innerHTML = '<option value="Todos">Todos</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
			if(cats.includes(prev) || prev==='Todos') select.value = prev; else select.value='Todos';
			select.onchange = ()=> renderList();
		}

		adminForm.addEventListener('submit', function(e){
			e.preventDefault();
			const nombre = productName.value.trim();
			const precio = Number(productPrice.value);
			const categoria = productCategory.value.trim();
			const ingredientes = productIngredients.value.split(',').map(s=>s.trim()).filter(Boolean);

			if(!nombre || !precio) return alert('Nombre y precio son requeridos');

			const saveProduct = (img)=>{
				const prod = { nombre, precio, categoria, ingredientes, tamano: productSize.value || '', imagen: img||'' };
				if(editIndex===null){ products.push(prod); } else { products[editIndex]=prod; }
				save(); renderCategoryOptions(); renderList(); resetForm();
			};

			const file = productImage.files[0];
			if(file){
				const reader = new FileReader();
				reader.onload = ()=> saveProduct(reader.result);
				reader.readAsDataURL(file);
			} else {
				const currentImg = editIndex!==null && products[editIndex] ? products[editIndex].imagen : '';
				saveProduct(currentImg);
			}
		});

		cancelEditButton.addEventListener('click', resetForm);

		productImage.addEventListener('change', ()=>{
			const f = productImage.files[0];
			if(!f){ imagePreview.innerHTML=''; return; }
			const r = new FileReader(); r.onload = ()=> imagePreview.innerHTML = `<img src="${r.result}" style="max-width:120px">`; r.readAsDataURL(f);
		});

		function startEdit(i){
			editIndex = i;
			const p = products[i];
			productName.value = p.nombre;
			productPrice.value = p.precio;
			productSize.value = p.tamano||'';
			productCategory.value = p.categoria === 'Hombre' ? 'Hombre' : 'Mujer';
			productIngredients.value = (p.ingredientes||[]).join(', ');
			imagePreview.innerHTML = p.imagen ? `<img src="${p.imagen}" style="max-width:120px">` : '';
			addProductButton.textContent='Actualizar producto';
			cancelEditButton.style.display='inline-block';
		}

		function deleteProduct(i){
			if(!confirm('Eliminar producto?')) return;
			products.splice(i,1);
			save(); renderCategoryOptions(); renderList(); resetForm();
		}

		function resetForm(){ editIndex=null; adminForm.reset(); imagePreview.innerHTML=''; addProductButton.textContent='Agregar producto'; cancelEditButton.style.display='none'; }

		// expose for inline handlers
		window.startEdit = startEdit; window.deleteProduct = deleteProduct;

		load();
	</script>
</body>
</html>
